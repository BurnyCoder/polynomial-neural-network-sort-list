[project]
name = "pnn-sort"
version = "0.1.0"
description = "Scientific study of strictly pure Polynomial Neural Networks for sorting values in a list"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Libor \"Burny\" Burian" }
]
dependencies = [
    "torch>=2.7.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "pytest>=8.3.0",
    "huggingface-hub>=0.26.0",
    "pyyaml>=6.0.2",
    "sympy>=1.13.0",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pnn_sort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
